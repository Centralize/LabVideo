[package]
name = "lab-video-player"
version = "0.1.1"
edition = "2021"
description = "Lab Video Player - a desktop media player"

[[bin]]
name = "lab-video-player"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.33.3"
cpal = "0.18.2"
rfd = "0.15.4"
png = "0.17.16"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_MediaFoundation",
    "Win32_UI_Shell",
    "Win32_System_SystemInformation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
